services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: commerce, POSTGRES_USER: commerce, POSTGRES_PASSWORD: commerce }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U commerce"], interval: 5s, timeout: 5s, retries: 10 }
  app:
    build: .
    environment: { SPRING_PROFILES_ACTIVE: prod, DATABASE_URL: jdbc:postgresql://postgres:5432/commerce, DATABASE_USER: commerce, DATABASE_PASSWORD: commerce }
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
