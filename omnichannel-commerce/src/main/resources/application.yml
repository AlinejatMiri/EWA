spring:
  application.name: omnichannel-commerce
  profiles.default: dev
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
  mvc.problemdetails.enabled: true
management.endpoints.web.exposure.include: health,info,metrics
app:
  jwt.secret: "change-this-development-secret-to-at-least-32-characters"
  jwt.access-minutes: 30
  cors.origins: "http://localhost:5173,http://localhost:3000"
---
spring:
  config.activate.on-profile: dev
  datasource.url: jdbc:h2:mem:commerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
  datasource.username: sa
  datasource.password: ""
  h2.console.enabled: true
---
spring:
  config.activate.on-profile: prod
  datasource.url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commerce}
  datasource.username: ${DATABASE_USER:commerce}
  datasource.password: ${DATABASE_PASSWORD:commerce}
